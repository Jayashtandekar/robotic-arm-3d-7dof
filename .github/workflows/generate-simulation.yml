name: Generate 3D simulation visuals

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-simulation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run motion planning tests
        run: python -m unittest discover -s tests -v
      - name: Render 3D comparison and GIF
        run: python run_7dof.py --trials 3 --iterations 1500 --astar-limit 450 --gif
      - name: Commit generated simulation visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/arm_3d_paths.png results/planner_comparison.png results/arm_motion_3d.gif
          if git diff --cached --quiet; then
            echo "No image changes to commit"
          else
            git commit -m "Add generated 7-DOF simulation GIF and plots [skip ci]"
            # Leave original benchmark CSVs untouched; only commit image outputs.
            git restore results/experiment_config.json results/summary.csv results/trials.csv
            # README or docs may have changed while plotting; rebase on top of them.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
